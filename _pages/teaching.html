permalink: /teaching/
author_profile: true

{% assign courses = site.teaching | sort: "date" | reverse %}

{% for post in courses %}
  <div style="margin-bottom: 1.5em;">
    <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 1em; flex-wrap: wrap;">
      <strong>{{ post.title | escape }}</strong>
      <span style="margin-left: auto; text-align: right;">
        {{ post.semester | escape }}
      </span>
    </div>
    {% if post.venue %}
      <div><em>{{ post.venue | escape }}</em></div>
    {% endif %}
  </div>
{% endfor %}
